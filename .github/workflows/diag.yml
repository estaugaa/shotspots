name: Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN || secrets.EARTHKEY_TOKEN }}
      NETLIFY_SITE_ID: a54b42ef-afe7-4c95-922e-7d174dff4e98
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install playwright && python -m playwright install --with-deps chromium webkit
      - run: python tools/diag.py
      - name: Push outputs to the diag-out branch
        if: always()
        run: |
          [ -d ux ] || exit 0
          cd ux && git init -q && git checkout -q -b diag-out && git add -A
          git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm "diag output"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-out
