name: Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN || secrets.EARTHKEY_TOKEN }}
      NETLIFY_SITE_ID: a54b42ef-afe7-4c95-922e-7d174dff4e98
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tools/diag.py
