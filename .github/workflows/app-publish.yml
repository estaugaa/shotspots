name: Publish on app change
# Any push that changes the app publishes it: no manual dispatch, and the service-worker version is derived from the
# app files at build time (pipeline/deploy.py), so phones always get the new code. Only app code that passed the checks
# is published: passing moves the app-verified branch, and every publish (data jobs included) takes app/ from there.
on:
  push:
    branches: [main]
    paths: ["app/**"]
permissions:
  contents: write   # moves the app-verified branch when the checks pass
  pages: write
  id-token: write
concurrency:
  group: app-publish
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04   # Playwright can't install its browser deps on 26.04 yet
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest && python -m pytest -q tests/test_consistency.py
      - name: JavaScript parses
        run: for f in app/*.js; do node -e "new Function(require('fs').readFileSync('$f','utf8'))" || exit 1; done
      - name: JavaScript unit tests
        run: for f in tests/js/*.test.js; do node "$f" || exit 1; done
      - name: Scoring test (same data, fixed clock; see tools/scoretest.py)
        shell: bash
        run: |
          pip install -q playwright && python -m playwright install --with-deps chromium
          python -u tools/scoretest.py 2>&1 | tee scoretest.txt; rc=${PIPESTATUS[0]}
          # a ranking change fails at once; only "unstable" (the test's own runs disagreeing) gets one more try
          if [ $rc -ne 0 ] && grep -q "unstable" scoretest.txt && ! grep -q "ranking changed" scoretest.txt; then
            echo "--- unstable: one retry ---" | tee -a scoretest.txt
            python -u tools/scoretest.py 2>&1 | tee -a scoretest.txt; rc=${PIPESTATUS[0]}
          fi
          exit $rc
      - name: Scoring output to the diag-publish branch (readable without logging in)
        if: always()
        run: |
          [ -f scoretest.txt ] || echo "scoring test did not run" > scoretest.txt
          mkdir -p out && cp scoretest.txt out/ && cd out && git init -q && git checkout -q -b diag-publish && git add -A
          git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm "publish ${{ github.sha }} ${{ job.status }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-publish
      - name: Mark this app as checked (publish.yml takes app/ from the app-verified branch)
        run: git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/app-verified
  publish:
    needs: checks
    uses: ./.github/workflows/publish.yml
