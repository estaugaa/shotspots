name: Publish on app change
# Any push that changes the app publishes it: no manual dispatch, and the service-worker version is derived from the
# app files at build time (pipeline/deploy.py), so phones always get the new code.
on:
  push:
    branches: [main]
    paths: ["app/**"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: app-publish
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04   # Playwright can't install its browser deps on 26.04 yet
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest && python -m pytest -q tests/test_consistency.py
      - name: JavaScript parses
        run: for f in app/*.js; do node -e "new Function(require('fs').readFileSync('$f','utf8'))" || exit 1; done
      - name: Scoring test (same data, fixed clock; see tools/scoretest.py)
        run: pip install playwright && python -m playwright install --with-deps chromium && python tools/scoretest.py
  publish:
    needs: checks
    uses: ./.github/workflows/publish.yml
