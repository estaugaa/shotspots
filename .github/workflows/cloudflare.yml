name: Cloudflare forms Worker
on:
  workflow_dispatch:
  push:
    paths: ["worker/**", ".github/workflows/cloudflare.yml"]
permissions:
  contents: write
concurrency:
  group: cloudflare
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set yet; skipping"; echo "SKIP=1" >> $GITHUB_ENV; fi
      - name: workers.dev subdomain
        if: env.SKIP != '1'
        run: |
          API=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" $API | python3 -c "import json,sys;j=json.load(sys.stdin);print((j.get('result') or {}).get('subdomain') or '')")
          if [ -z "$SUB" ]; then
            for s in shotspots-eric shotspots-estaugaa shotspots-$RANDOM; do
              R=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "{\"subdomain\":\"$s\"}" $API)
              echo "$R" | grep -Eq '"success": ?true' && SUB=$s && break
              echo "subdomain $s: $R"
            done
          fi
          [ -n "$SUB" ] || { echo "could not get a workers.dev subdomain"; exit 1; }
          echo "SUB=$SUB" >> $GITHUB_ENV; echo "workers.dev subdomain: $SUB"
      - name: D1 database
        if: env.SKIP != '1'
        working-directory: worker
        run: |
          W="npx --yes wrangler@4"
          ID=$($W d1 list --json | python3 -c "import json,sys;d=[x for x in json.load(sys.stdin) if x['name']=='shotspots'];print(d[0]['uuid'] if d else '')")
          if [ -z "$ID" ]; then $W d1 create shotspots; ID=$($W d1 list --json | python3 -c "import json,sys;print([x for x in json.load(sys.stdin) if x['name']=='shotspots'][0]['uuid'])"); fi
          sed "s/__DB_ID__/$ID/" wrangler.toml.tmpl > wrangler.toml
          $W d1 execute shotspots --remote --file=schema.sql --yes
      - name: Deploy Worker
        if: env.SKIP != '1'
        working-directory: worker
        run: |
          npx --yes wrangler@4 deploy
          if [ -n "$GH_DISPATCH_TOKEN" ]; then printf '%s' "$GH_DISPATCH_TOKEN" | npx --yes wrangler@4 secret put GH_TOKEN; else echo "::warning::GH_DISPATCH_TOKEN not set: scheduler stays off"; fi
          URL="https://shotspots-forms.$SUB.workers.dev"
          for i in 1 2 3 4 5 6; do curl -sf "$URL/health" && break; sleep 10; done
          echo "{\"forms\": \"$URL\"}" > ../config/endpoints.json
      - name: Save endpoint
        if: env.SKIP != '1'
        run: |
          git config user.name "shotspots-bot"; git config user.email "shotspots-bot@users.noreply.github.com"
          git add config/endpoints.json
          git diff --cached --quiet || git commit -m "cloudflare: forms endpoint [skip ci]"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
