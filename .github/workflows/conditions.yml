name: HRRR conditions
on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:
concurrency:
  group: pipeline
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
      NETLIFY_SITE_ID: a54b42ef-afe7-4c95-922e-7d174dff4e98
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EBIRD_KEY: ${{ secrets.EBIRD_KEY }}
      EBD_URL: ${{ secrets.EBD_URL }}
      FLICKR_KEY: ${{ secrets.FLICKR_KEY }}
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      ASTROMETRY_KEY: ${{ secrets.ASTROMETRY_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      SS_CACHE: ${{ github.workspace }}/.cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: ss-cache-conditions-${{ github.run_id }}
          restore-keys: |
            ss-cache-conditions-
            ss-cache-
      - run: pip install -r requirements.txt
      - run: python -m pipeline conditions research_sync
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache
          key: ss-cache-conditions-${{ github.run_id }}
      - name: Commit feed
        if: always()
        run: |
          git config user.name "shotspots-bot"
          git config user.email "shotspots-bot@users.noreply.github.com"
          git add -A -- feed data config inbox
          git diff --cached --quiet || git commit -m "conditions: update feed [skip ci]"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
  publish:
    needs: run
    if: always()
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
