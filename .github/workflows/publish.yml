name: Publish site (GitHub Pages)
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04, where Playwright can't install yet
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: ./.github/actions/data
        with:
          mode: setup
      - name: App code that passed the checks (app-verified branch; see app-publish.yml)
        run: |
          if git fetch -q --depth 1 origin app-verified; then
            git checkout -q FETCH_HEAD -- app && echo "app/ from app-verified $(git rev-parse --short FETCH_HEAD)"
            git diff --quiet HEAD -- app || echo "::notice::main has app changes that have not passed the checks yet; publishing the last checked app"
          else echo "no app-verified branch yet: publishing app/ from main"; fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - run: python -m pipeline build_site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true   # v4+ drops dotfiles by default; keep .nojekyll as before
      - id: deploy
        uses: actions/deploy-pages@v5
