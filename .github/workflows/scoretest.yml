name: Scoring test
# Repeatable scoring test (tools/scoretest.py). check: compare with tests/score/expected.json (also runs in app-publish).
# update: accept the current ranking after an intended scoring change, then publish the app.
# capture: record fresh fixtures from the live site (new data, new time), then update and publish.
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [check, update, capture]
        default: check
  push:   # branches other than main check before merging (main is checked by app-publish)
    branches-ignore: [main]
    paths: ["app/**", "tools/scoretest.py", "tests/score/**"]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  run:
    runs-on: ubuntu-24.04   # Playwright can't install its browser deps on 26.04 yet
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - id: mode
        env:
          MSG: ${{ github.event.head_commit.message }}
          M: ${{ inputs.mode }}
        run: |
          # on a branch push, a commit message with [scoretest:update] or [scoretest:capture] does that and saves it to the branch
          [ -n "$M" ] || M=$(printf '%s' "$MSG" | grep -o 'scoretest:\(update\|capture\)' | head -1 | cut -d: -f2); [ -n "$M" ] || M=check
          echo "mode=$M" >> "$GITHUB_OUTPUT"
          N=$(printf '%s' "$MSG" | grep -o 'scoretest:runs=[0-9]*' | head -1 | cut -d= -f2); echo "SCORETEST_RUNS=${N:-2}" >> "$GITHUB_ENV"
      - run: python tools/scoretest.py --${{ steps.mode.outputs.mode }} 2>&1 | tee scoretest.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Result to the diag-scoretest branch (readable without logging in)
        if: always()
        run: |
          mkdir -p out && cp scoretest.txt out/ && cd out && git init -q && git checkout -q -b diag-scoretest && git add -A
          git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm "scoretest ${{ github.ref_name }} ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-scoretest
      - name: Save the expected ranking
        if: steps.mode.outputs.mode != 'check'
        run: |
          git config user.name "shotspots-bot"; git config user.email "actions@users.noreply.github.com"
          git add tests/score && git commit -qm "Scoring test: ${{ steps.mode.outputs.mode }}" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
  publish:
    needs: run
    if: needs.run.outputs.mode != 'check' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publish.yml
