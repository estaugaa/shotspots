name: Webcam truth (sunrise/sunset)
# After every satellite run (~30 min): photograph public road cameras whose sunrise or sunset is happening, measure the
# real colour, save the forecast for comparison, and refit (pipeline/camtruth.py). No publish: data only.
on:
  workflow_run:
    workflows: ["GOES fog now"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: camtruth
  cancel-in-progress: false
jobs:
  cams:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04, where Playwright can't install yet
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/data
        with:
          mode: setup
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - run: python -m pipeline camtruth
      - name: Save (data branch)
        uses: ./.github/actions/data
        with:
          mode: save
          message: "camtruth [skip ci]"
