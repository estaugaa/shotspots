name: Webcam truth (sunrise/sunset)
# After every satellite run (~30 min): photograph public road cameras whose sunrise or sunset is happening, measure the
# real colour, save the forecast for comparison, and refit (pipeline/camtruth.py). No publish: data only.
on:
  workflow_run:
    workflows: ["GOES fog now"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: camtruth
  cancel-in-progress: false
jobs:
  cams:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - run: python -m pipeline camtruth
      - name: Save
        run: |
          git config user.name "shotspots-bot"; git config user.email "shotspots-bot@users.noreply.github.com"
          git add -A -- data feed   # only this job changes these here; some paths don't exist before the first capture
          git diff --cached --quiet || git commit -qm "camtruth [skip ci]"
          for i in 1 2 3 4; do git pull -q --rebase -X theirs && git push -q && break; sleep 7; done
