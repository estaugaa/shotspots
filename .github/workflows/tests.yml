name: Python tests
# Unit tests (tests/): terrain horizons, GOES projection, verification maths, app/pipeline consistency.
# Runs on any change to the pipeline, the tests, config, or the requirements; app pushes run the consistency test in app-publish.
# Data jobs install the exact versions in requirements.lock, so an upstream release can't break a scheduled run. The second
# job installs the newest versions requirements.txt allows, tests them, and publishes `pip freeze` to the diag-freeze branch:
# copy it over requirements.lock to upgrade.
on:
  push:
    paths: ["pipeline/**", "tests/**", "config/**", "requirements.*", "app/data.js", ".github/workflows/tests.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r "$( [ -f requirements.lock ] && echo requirements.lock || echo requirements.txt )" pytest
      - run: python -m pytest -q tests/ 2>&1 | tee pytest.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Output to the diag-tests branch (readable without logging in)
        if: always()
        run: |
          mkdir -p out && cp pytest.txt out/ && cd out && git init -q && git checkout -q -b diag-tests && git add -A
          git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm "pytest ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-tests
  newest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Newest allowed versions, frozen
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install -q -r requirements.txt
          mkdir -p out && /tmp/v/bin/pip freeze > out/requirements.lock
          if [ -f requirements.lock ]; then diff requirements.lock out/requirements.lock && echo "lock is current" || echo "newer versions available (above)"; fi
      - name: Tests on the newest versions
        run: /tmp/v/bin/pip install -q pytest && /tmp/v/bin/python -m pytest -q tests/
      - name: Publish the freeze to the diag-freeze branch
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b diag-freeze && git add -A
          git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm "freeze ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-freeze
