name: Python tests
# Unit tests (tests/): terrain horizons, GOES projection, verification maths, app/pipeline consistency.
# Runs on any change to the pipeline, the tests, config, or the requirements; app pushes run the consistency test in app-publish.
on:
  push:
    paths: ["pipeline/**", "tests/**", "config/**", "requirements.txt", "app/data.js", ".github/workflows/tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/
