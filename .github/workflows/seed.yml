name: Starter spots (state by state)
on:
  workflow_dispatch:
    inputs:
      states:
        description: "State codes, space separated (WA OR ID CA ...)"
        default: "WA OR"
        required: true
  schedule:
    - cron: "17 10 * * *"   # daily: fill in any state that has no starter spots yet (one run, states in sequence)
concurrency:
  group: long-${{ github.workflow }}-${{ inputs.states }}   # long jobs queue separately so the 30-minute updates aren't blocked or cancel them
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
      NETLIFY_SITE_ID: a54b42ef-afe7-4c95-922e-7d174dff4e98
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EBIRD_KEY: ${{ secrets.EBIRD_KEY }}
      EBD_URL: ${{ secrets.EBD_URL }}
      FLICKR_KEY: ${{ secrets.FLICKR_KEY }}
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN || secrets.EARTHKEY_TOKEN }}
      ASTROMETRY_KEY: ${{ secrets.ASTROMETRY_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      SS_CACHE: ${{ github.workspace }}/.cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: ss-cache-seed-${{ github.run_id }}
          restore-keys: |
            ss-cache-seed-
            ss-cache-
      - run: pip install -r requirements.txt
      - id: st
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          S="${{ inputs.states }}"
          if [ -z "$S" ]; then
            # scheduled fill-in: stand aside while a rebuild is running (two writers clash on border tiles)
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/seed.yml/runs?status=in_progress" --jq '[.workflow_runs[]|select(.id != ${{ github.run_id }})]|length')
            if [ "$n" != "0" ]; then echo "another seed run is going; skipping"; echo "states=" >> $GITHUB_OUTPUT; exit 0; fi
            S=$(python tools/seed_index.py --missing)
          fi
          # long lists run 8 states per run, then hand the rest to the next run (one at a time, so border tiles never clash)
          set -- $S; NOW="${*:1:4}"; REST="${*:5}"
          echo "states=$NOW" >> $GITHUB_OUTPUT; echo "rest=$REST" >> $GITHUB_OUTPUT; echo "now: $NOW / later: $REST"
      - if: steps.st.outputs.states != ''
        run: python -m pipeline seed $STATES
        env:
          STATES: ${{ steps.st.outputs.states }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache
          key: ss-cache-seed-${{ github.run_id }}
      - name: Commit feed
        if: always()
        run: |
          git config user.name "shotspots-bot"
          git config user.email "shotspots-bot@users.noreply.github.com"
          git add -A -- feed data config inbox
          git diff --cached --quiet || git commit -m "seed: starter spots [skip ci]"
          # several state batches run in parallel: after each rebase rebuild the index from every tile file
          for i in 1 2 3 4 5 6; do
            git pull --rebase -X theirs || { git rebase --abort; sleep 7; continue; }
            python tools/seed_index.py && git add feed/seed/index.json && { git diff --cached --quiet || git commit -qm "seed: index [skip ci]"; }
            git push && break; sleep $((RANDOM % 20 + 5))
          done
      - name: Hand the remaining states to the next run
        if: ${{ !cancelled() && steps.st.outputs.rest != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run seed.yml -f states="${{ steps.st.outputs.rest }}"
      - name: Last batch done - work out which way the new starter spots face
        if: ${{ !cancelled() && steps.st.outputs.rest == '' && inputs.states != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run job.yml -f job=seedlight
  publish:
    needs: run
    if: always()
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
