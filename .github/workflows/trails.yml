name: Trails from parking
on:
  workflow_dispatch:
concurrency:
  group: pipeline
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04, where Playwright can't install yet
    timeout-minutes: 340
    env:
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
      NETLIFY_SITE_ID: a54b42ef-afe7-4c95-922e-7d174dff4e98
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EBIRD_KEY: ${{ secrets.EBIRD_KEY }}
      EBD_URL: ${{ secrets.EBD_URL }}
      FLICKR_KEY: ${{ secrets.FLICKR_KEY }}
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN || secrets.EARTHKEY_TOKEN }}
      ASTROMETRY_KEY: ${{ secrets.ASTROMETRY_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      SS_CACHE: ${{ github.workspace }}/.cache
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/data
        with:
          mode: setup
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache/restore@v6
        with:
          path: .cache
          key: ss-cache-trails-${{ github.run_id }}
          restore-keys: |
            ss-cache-trails-
            ss-cache-
      - run: pip install -r requirements.lock
      - run: python -m pipeline trails
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: .cache
          key: ss-cache-trails-${{ github.run_id }}
      - name: Save feed and data (data branch)
        if: always()
        uses: ./.github/actions/data
        with:
          mode: save
          message: "trails: update feed [skip ci]"
      - name: Commit config and inbox changes (main)
        if: always()
        run: |
          git config user.name "shotspots-bot"
          git config user.email "shotspots-bot@users.noreply.github.com"
          git add -A -- config inbox
          git diff --cached --quiet && exit 0   # (feed/ and data/ are linked to the data branch here: --autostash below)
          git commit -m "trails: config [skip ci]"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && break; git rebase --abort 2>/dev/null; [ $i = 3 ] && { echo "::error::could not push to main after 3 tries"; exit 1; }; sleep 5; done
  publish:
    needs: run
    if: always()
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
