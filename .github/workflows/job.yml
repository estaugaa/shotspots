name: Run a pipeline job
run-name: "job: ${{ inputs.job || 'scheduled' }}"
on:
  schedule:
    - cron: "15 3 * * *"   # fogprob: valley-fog chance for tomorrow dawn, after the evening observations (7:15 PM Pacific)
    - cron: "20 20 * * *"  # skill: forecast vs airport-observed sky at the last day's sunrises and sunsets (12:20 PM Pacific)
    - cron: "40 10 * * *"  # deeproutes: walking routes for nationally researched spots (2:40 AM Pacific; chains itself)
  workflow_dispatch:
    inputs:
      job:
        description: "Job name (photostats, verifyobs, ...)"
        required: true
concurrency:
  group: long-${{ github.workflow }}-${{ inputs.job || (github.event.schedule == '20 20 * * *' && 'skill') || (github.event.schedule == '40 10 * * *' && 'deeproutes') || 'fogprob' }}   # long jobs queue separately so the 30-minute updates aren't blocked or cancel them
  cancel-in-progress: false
permissions:
  contents: write
  actions: write   # long jobs (seedpop, hours) queue their own next run until done
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
      NETLIFY_SITE_ID: a54b42ef-afe7-4c95-922e-7d174dff4e98
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EBIRD_KEY: ${{ secrets.EBIRD_KEY }}
      EBD_URL: ${{ secrets.EBD_URL }}
      FLICKR_KEY: ${{ secrets.FLICKR_KEY }}
      MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
      NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN || secrets.EARTHKEY_TOKEN }}
      ASTROMETRY_KEY: ${{ secrets.ASTROMETRY_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      SS_CACHE: ${{ github.workspace }}/.cache
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/data
        with:
          mode: setup
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: ss-cache-job-${{ github.run_id }}
          restore-keys: |
            ss-cache-job-
            ss-cache-
      - run: pip install -r requirements.lock
      - run: python -m pipeline $JOB
        env:
          JOB: ${{ inputs.job || (github.event.schedule == '20 20 * * *' && 'skill') || (github.event.schedule == '40 10 * * *' && 'deeproutes') || 'fogprob' }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache
          key: ss-cache-job-${{ github.run_id }}
      - name: Save feed and data (data branch)
        if: always()
        uses: ./.github/actions/data
        with:
          mode: save
          message: "job: update feed [skip ci]"
      - name: Commit config and inbox changes (main)
        if: always()
        run: |
          git config user.name "shotspots-bot"
          git config user.email "shotspots-bot@users.noreply.github.com"
          git add -A -- config inbox
          git diff --cached --quiet && exit 0   # (feed/ and data/ are linked to the data branch here: --autostash below)
          git commit -m "job: config [skip ci]"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && break; sleep 5; done
      - name: Queue the next run if work is left
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: ${{ inputs.job || (github.event.schedule == '20 20 * * *' && 'skill') || (github.event.schedule == '40 10 * * *' && 'deeproutes') || 'fogprob' }}
        run: |
          if [ -f .more ]; then echo "work left: queueing another $JOB run"; gh workflow run job.yml --ref main -f job="$JOB"; fi
  publish:
    needs: run
    if: always()
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
