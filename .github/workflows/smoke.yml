name: Smoke test (live app)
on:
  workflow_run:
    workflows: ["GOES fog now", "HRRR conditions", "Run a pipeline job"]   # these call Publish
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write   # pushes the output to the diag-smoke branch (logs need a sign-in)
jobs:
  smoke:
    runs-on: ubuntu-24.04   # Playwright can't install its browser deps on 26.04 yet
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
      - id: chg   # only test when the app itself changed in the last hour (pipeline runs every 30 min)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -n "$(git log --since='65 minutes ago' --format=%h -- app index.html)" ]; then echo "go=1" >> $GITHUB_OUTPUT; fi
      - if: steps.chg.outputs.go == '1'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - if: steps.chg.outputs.go == '1'
        run: sleep 60   # let GitHub Pages finish serving the new version
      - if: steps.chg.outputs.go == '1'
        run: pip install playwright && python -m playwright install --with-deps chromium webkit
      - if: steps.chg.outputs.go == '1'
        name: Data proxies answer (7Timer via Worker, satellite gap grid)
        run: |
          W=$(python3 -c "import json;print(json.load(open('app/endpoints.json'))['forms'])" 2>/dev/null || echo https://shotspots-forms.shotspots-eric.workers.dev)
          curl -sf -H "Origin: https://estaugaa.github.io" "$W/seeing?lat=45.58&lon=-122.35" | python3 -c "import json,sys;j=json.load(sys.stdin);print('seeing rows',len(j['dataseries']))"
          curl -sf https://estaugaa.github.io/shotspots/feed/goes_grid.json | python3 -c "import json,sys;j=json.load(sys.stdin);print('gap grid',j['nx'],'x',j['ny'],'obs',j['obs'],'cloudy cells',sum(c>'4' for c in j['d9']))" || echo "gap grid not published yet"
      - if: steps.chg.outputs.go == '1'
        run: python -u tools/smoke.py 2>&1 | tee smoke.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Output to the diag-smoke branch (readable without logging in)
        if: always() && steps.chg.outputs.go == '1'
        run: |
          [ -f smoke.txt ] || echo "smoke.py did not run (an earlier step failed)" > smoke.txt
          mkdir -p out && cp smoke.txt out/ && cd out && git init -q && git checkout -q -b diag-smoke && git add -A
          git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm "smoke ${{ github.sha }} ${{ job.status }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-smoke
