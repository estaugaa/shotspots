name: Smoke test (live app)
on:
  workflow_run:
    workflows: ["Publish site (GitHub Pages)"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sleep 60   # let GitHub Pages finish serving the new version
      - run: pip install playwright && python -m playwright install --with-deps chromium webkit
      - run: python tools/smoke.py
