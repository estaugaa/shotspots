name: Nightly check
on:
  schedule:
    - cron: "23 11 * * *"   # 3:23 AM Pacific
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04   # Playwright can't install its browser deps on 26.04 yet
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: pip install pytest && python -m pytest -q tests/test_consistency.py
      - run: python tools/regress.py
      - name: Expectations (pass/fail on real situations)
        if: always()
        run: python tools/expect.py
      - name: Save the result to the test history
        if: always()
        run: |
          git config user.name "shotspots-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/test_history.jsonl && git commit -qm "Test history" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
