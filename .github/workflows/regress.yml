name: Nightly check
on:
  schedule:
    - cron: "23 11 * * *"   # 3:23 AM Pacific
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04   # Playwright can't install its browser deps on 26.04 yet
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/data
        with:
          mode: setup
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: pip install pytest && python -m pytest -q tests/test_consistency.py
      - run: python tools/regress.py
      - name: Expectations (pass/fail on real situations)
        if: always()
        run: python tools/expect.py
      - name: Prediction log (live site ranks the next sunrise and sunset, and scores the sky at every recent webcam; data/archive/predictions, predcams)
        if: always()
        continue-on-error: true
        timeout-minutes: 25
        run: python tools/scoretest.py --live
      - name: Save the result to the test history and the prediction log (data branch)
        if: always()
        uses: ./.github/actions/data
        with:
          mode: save
          message: "Test history, prediction log [skip ci]"
