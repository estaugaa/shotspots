name: Nightly check
on:
  schedule:
    - cron: "23 11 * * *"   # 3:23 AM Pacific
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04   # Playwright can't install its browser deps on 26.04 yet
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tools/regress.py
