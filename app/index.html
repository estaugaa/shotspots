<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ShotSpots</title>
<meta name="theme-color" content="#1E2628">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ShotSpots">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button class="loc" id="locBtn" aria-label="Change location"><span class="pin" aria-hidden="true"></span><span id="locName">Finding you…</span></button>
  <div class="topr">
    <span class="fresh" id="fresh"></span>
    <button class="iconbtn" id="setBtn" aria-label="Settings and live data" title="Settings">⚙</button>
    <button class="iconbtn" id="nightBtn" aria-pressed="false" aria-label="Night vision (red screen)" title="Night vision">◐</button>
  </div>
  <div class="fbar chips" id="fbar" role="toolbar" aria-label="Show only"></div>
</header>

<main id="main">
  <section id="v-now" class="view" aria-label="Now"></section>
  <section id="v-map" class="view" hidden aria-label="Map"><div id="map"></div><div class="maplegend" id="mapLegend"></div></section>
  <section id="v-spots" class="view" hidden aria-label="Spots"></section>
  <section id="v-sky" class="view" hidden aria-label="Night sky"></section>
  <section id="v-cal" class="view" hidden aria-label="Calendar"></section>
</main>

<nav class="tabs" aria-label="Sections">
  <button data-v="now" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="14" r="4"/><path d="M2 18h20M12 4v3M4.9 7.9l2 2M19.1 7.9l-2 2"/></svg><span>Plan</span></button>
  <button data-v="map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg><span>Map</span></button>
  <button data-v="spots"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Spots</span></button>
</nav>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheetbar"><button class="iconbtn" id="sheetClose" aria-label="Close">✕</button></div>
  <div class="sheetbody" id="sheetBody"></div>
</div>

<div class="sheet small" id="locSheet" hidden role="dialog" aria-modal="true" aria-labelledby="locTitle">
  <div class="sheetbar"><b id="locTitle">Plan from</b><button class="iconbtn" id="locClose" aria-label="Close">✕</button></div>
  <div class="sheetbody">
    <button class="wide primary" id="useGps">Use my current location</button>
    <form id="locForm" class="search"><input id="locQ" type="search" placeholder="Search a place or address" autocomplete="off" aria-label="Search a place"><button type="submit">Search</button></form>
    <div id="locHits"></div>
    <p class="label">Quick picks</p>
    <div id="locPresets" class="chips"></div>
    <p class="muted" id="locMsg"></p>
  </div>
</div>

<div class="sheet small" id="setSheet" hidden role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="sheetbar"><b id="setTitle">Settings</b><button class="iconbtn" id="setClose" aria-label="Close">✕</button></div>
  <div class="sheetbody" id="setBody"></div>
</div>

<form name="outcome" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="spot"><input name="t"><input name="kind"><input name="rating"><input name="keepers"><input name="sky"><input name="fog"><input name="color">
  <input name="species"><input name="ebird"><input name="sqm"><textarea name="notes"></textarea><textarea name="pred"></textarea>
</form>

<form name="research" data-netlify="true" hidden><input name="label"><input name="lat"><input name="lon"><input name="radius_km"><input name="focus"></form>
<form name="push_sub" data-netlify="true" hidden><input name="action"><input name="sub"><input name="device"></form>
<form name="alert_settings" data-netlify="true" hidden><input name="enabled"><input name="min_prob"><input name="max_per_day"><input name="max_km"><input name="max_km_dark"><input name="aurora_kp"><input name="quiet_start"><input name="quiet_end"><input name="rules"><input name="push_rules"></form>
<form name="spot_feedback" data-netlify="true" hidden><input name="id"><input name="vote"><input name="name"><input name="cats"><input name="note"></form>
<form name="research_settings" data-netlify="true" hidden><input name="enabled"><input name="regions_per_night"><input name="max_new_spots_per_night"><input name="max_web_searches_per_night"><input name="max_minutes_per_night"><input name="auto_expand"><input name="max_km_from_home"></form>

<div class="toast" id="toast" role="status" hidden></div>

<script src="astro.js"></script>
<script src="data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<script src="app.js" defer></script>
<script src="live.js" defer></script>
<script src="sky.js" defer></script>
<script src="stars.js" defer></script>
<script src="feed.js" defer></script>
<script src="shots.js" defer></script>
<script src="research.js" defer></script>
<script src="alerts.js" defer></script>
<script src="access.js" defer></script>
<script src="photolog.js" defer></script>
<script src="forms.js" defer></script>
<script src="nearby.js" defer></script>
<script src="camera.js" defer></script>
<script src="photos.js" defer></script>
<script src="seed.js" defer></script>
<script src="kit.js" defer></script>
<script src="prefs.js" defer></script>
<script src="desktop.js" defer></script>
<script src="glossary.js" defer></script>
</body>
</html>
